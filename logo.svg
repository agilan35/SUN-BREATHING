<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A0005" />
      <stop offset="45%" stop-color="#B90015" />
      <stop offset="85%" stop-color="#FF3355" />
      <stop offset="100%" stop-color="#FF98A8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="100%" stop-color="#FFA751" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Shield Badge -->
  <path d="M50 8 L85 22 V50 C85 70 50 92 50 92 C50 92 15 70 15 50 V22 Z" 
        fill="#121212" stroke="url(#flameGrad)" stroke-width="3.5" filter="url(#glow)" />

  <!-- Inner Shield Accent -->
  <path d="M50 15 L78 27 V48 C78 64 50 82 50 82 C50 82 22 64 22 48 V27 Z" 
        fill="none" stroke="url(#flameGrad)" stroke-width="1.2" stroke-dasharray="3 2" opacity="0.6" />

  <!-- Sun Breathing Flame Icon -->
  <path d="M50 30 C53 38 62 43 62 52 C62 61 54 67 50 68 C46 67 38 61 38 52 C38 43 47 38 50 30 Z" 
        fill="url(#flameGrad)" />
  
  <!-- Core Sun Orb -->
  <circle cx="50" cy="53" r="6.5" fill="url(#goldGrad)" />

  <!-- Checkmark of Authenticity -->
  <path d="M44 53 L48 57 L57 47" 
        fill="none" stroke="#0D0D0D" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>
